<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mint Launcher</title>
    <style>
      /* Renders immediately from raw HTML, before the JS bundle loads and
         React mounts - otherwise the window shows nothing but a blank
         background for a moment on startup. React's first render replaces
         this by overwriting #root's contents. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #14181a;
      }
      .boot-loading {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #7c8a88;
        font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 14px;
      }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #333b3f;
        border-top-color: #34d399;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-loading">
        <div class="boot-spinner"></div>
        <div>Loading Mint Launcher…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
